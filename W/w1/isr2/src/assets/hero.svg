<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="A radar sweep over a fragmented ten-node atlas grid, mapping the gaps between nodes">
	<defs>
		<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2dd4bf" stop-opacity="0.9" />
			<stop offset="1" stop-color="#22d3ee" stop-opacity="0.25" />
		</linearGradient>
		<linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#22d3ee" stop-opacity="0.75" />
			<stop offset="1" stop-color="#2dd4bf" stop-opacity="0.1" />
		</linearGradient>
		<radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#8ff9df" />
			<stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.5" />
			<stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
		</radialGradient>
		<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="5" result="b" />
			<feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
		</filter>
	</defs>

	<g opacity="0.5" stroke="#14b8a6" stroke-width="0.7">
		<path d="M60 40h520M60 140h520M60 240h520M60 340h520M60 440h520" opacity="0.25" />
		<path d="M60 40v400M180 40v400M300 40v400M420 40v400M540 40v400" opacity="0.18" />
	</g>

	<circle cx="320" cy="240" r="150" fill="none" stroke="url(#ring)" stroke-width="1.1" stroke-dasharray="4 6" />
	<circle cx="320" cy="240" r="105" fill="none" stroke="url(#ring)" stroke-width="1" stroke-dasharray="3 7" opacity="0.75" />
	<circle cx="320" cy="240" r="196" fill="none" stroke="url(#ring)" stroke-width="0.9" stroke-dasharray="2 9" opacity="0.5" />

	<!-- radar sweep -->
	<path d="M320 240 L470 240 A150 150 0 0 0 425 106 Z" fill="#22d3ee" opacity="0.13" />
	<path d="M320 240 L425 106" stroke="#7df9d5" stroke-width="1.3" opacity="0.7" />

	<circle cx="320" cy="240" r="46" fill="url(#core)" opacity="0.55" />

	<!-- the ten gaps: nodes with broken links between them -->
	<g stroke="url(#link)" stroke-width="1.6" fill="none">
		<path d="M320 240 L198 168" />
		<path d="M320 240 L446 172" />
		<path d="M320 240 L172 300" />
		<path d="M320 240 L430 322" />
		<path d="M320 240 L286 128" />
		<path d="M320 240 L356 356" />
		<path d="M198 168 L286 128" stroke-dasharray="5 6" />
		<path d="M446 172 L356 356" stroke-dasharray="5 6" />
		<path d="M172 300 L286 128" stroke-dasharray="5 6" opacity="0.6" />
		<path d="M430 322 L446 172" stroke-dasharray="5 6" opacity="0.6" />
	</g>

	<g filter="url(#soft)">
		<circle cx="320" cy="240" r="9" fill="#8ff9df" />
		<g fill="#0b2f33" stroke="#2dd4bf" stroke-width="2">
			<circle cx="198" cy="168" r="8" />
			<circle cx="446" cy="172" r="7" />
			<circle cx="172" cy="300" r="7.5" />
			<circle cx="430" cy="322" r="8" />
			<circle cx="286" cy="128" r="7" />
			<circle cx="356" cy="356" r="7" />
		</g>
		<g fill="#22d3ee" opacity="0.9">
			<circle cx="500" cy="120" r="3.4" />
			<circle cx="140" cy="112" r="3" />
			<circle cx="498" cy="392" r="3" />
			<circle cx="128" cy="414" r="2.6" />
		</g>
	</g>

	<!-- fractional sukuk ring -->
	<g transform="translate(548 236)" fill="none" stroke="#2dd4bf" stroke-width="1.4" opacity="0.8">
		<circle r="34" stroke-dasharray="70 40" />
		<circle r="24" stroke-dasharray="22 14" opacity="0.8" />
		<circle r="14" stroke-dasharray="8 6" opacity="0.7" />
	</g>
	<g transform="translate(548 236)" fill="#7df9d5" opacity="0.9">
		<circle r="2.6" />
	</g>
</svg>
